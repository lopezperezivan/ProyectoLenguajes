        <div class="container-fluid">
          <a class="navbar-brand" href="#">Iván López</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">

          <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav ms-auto mb-2 mb-md-0">

              </li>
            </ul>
            <form id="search-form" class="d-flex" role="search">
              <input id="search-input" class="form-control me-2" type="search" placeholder="Buscar" aria-label="Buscar">
              <button class="btn btn-outline-success" type="submit">Buscar</button>

    <main class="container my-5 fade-in">
        <section class="text-center mb-4">
            <h2 class="IUI">Contacto</h2>
            <p>Email: lopezperezivan06@gmail.com</p>
            <p>Teléfono: 647028922</p>
            <p>Ubicación: Utrera, Sevilla, CP: 41710</p>
        </section>

        <section class="text-center">
            <div class="container p-4 rounded" style="background-color: #f8f9fa;">
                <form id="contact-form">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="name" placeholder="Tu nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="surname" class="form-label">Apellidos</label>
                        <input type="text" class="form-control" id="surname" placeholder="Tus apellidos" required>
                    </div>
                    <div class="mb-3">
                        <label for="gender" class="form-label">Género</label>
                        <select class="form-select" id="gender" required>
                            <option value="male">Masculino</option>
                            <option value="female">Femenino</option>
                            <option value="other">Otro</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="reason" class="form-label">Motivo de Consulta</label>
                        <select class="form-select" id="reason" required>
                            <option value="general">Trabajo</option>
                            <option value="support">Consulta</option>
                            <option value="feedback">Otro</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Tu mensaje" required></textarea>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label" for="terms">Acepto los términos y condiciones</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
                <div id="success-message" class="alert alert-success mt-3" style="display: none;"></div>
                <div id="error-message" class="alert alert-danger mt-3" style="display: none;"></div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p>&copy; 2024 Iván López Pérez</p>
    </footer>
</body>

</html>
